services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stayflow
      POSTGRES_PASSWORD: stayflow
      POSTGRES_DB: stayflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayflow"]
      interval: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://stayflow:stayflow@db:5432/stayflow
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-in-production}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
